# Git hooks. Install with: lefthook install
# https://lefthook.dev

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        unformatted="$(gofmt -l {staged_files})"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:"
          echo "$unformatted"
          exit 1
        fi
    vet:
      glob: "*.go"
      run: go vet ./...
    lint:
      glob: "*.go"
      run: make lint

commit-msg:
  commands:
    conventional-commit:
      run: |
        head -n 1 {1} | grep -Eq '^(Merge |Revert "|(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+)' || {
          echo "The commit subject must follow Conventional Commits, for example:"
          echo "  feat(auth): rotate refresh tokens"
          exit 1
        }
