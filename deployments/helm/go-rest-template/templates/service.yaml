apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-rest-template.fullname" . }}
  labels:
    {{- include "go-rest-template.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "go-rest-template.selectorLabels" . | nindent 4 }}
