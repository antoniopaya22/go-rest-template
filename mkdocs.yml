site_name: go-rest-template
site_description: Go REST API template with an enforced OpenAPI contract, token authentication, PostgreSQL and SQLite, and a tool that trims it down to your project
site_url: https://antoniopaya22.github.io/go-rest-template/
repo_url: https://github.com/antoniopaya22/go-rest-template
repo_name: antoniopaya22/go-rest-template
edit_uri: edit/main/docs/
copyright: Copyright &copy; Antonio Payá González and contributors

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Montserrat
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css
  - stylesheets/brand.css

# Copies api/openapi.yaml into the site for the API reference page, and
# includes CHANGELOG.md and CONTRIBUTING.md with their links pointing at GitHub.
hooks:
  - overrides/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }

extra:
  header_nav:
    - title: Docs
      url: getting-started/
    - title: Architecture
      url: architecture/
    - title: Guides
      url: guides/
    - title: Deployment
      url: deployment/
    - title: Reference
      url: reference/
  header_cta:
    title: Get started
    url: getting-started/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/antoniopaya22

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Create your project: getting-started/create-your-project.md
      - Quickstart: getting-started/quickstart.md
  - Architecture:
      - Overview: architecture/index.md
      - Request lifecycle: architecture/request-lifecycle.md
      - Errors: architecture/errors.md
      - Project layout: architecture/project-layout.md
  - Guides:
      - Overview: guides/index.md
      - Add a resource: guides/add-a-resource.md
      - API conventions: guides/api-conventions.md
      - Authentication and authorization: guides/authentication.md
      - Database: guides/database.md
      - Configuration: guides/configuration.md
      - Testing: guides/testing.md
      - Observability: guides/observability.md
  - Deployment:
      - Overview: deployment/index.md
      - Docker: deployment/docker.md
      - Compose: deployment/compose.md
      - Kubernetes: deployment/kubernetes.md
      - Production checklist: deployment/production-checklist.md
  - Reference:
      - Overview: reference/index.md
      - Configuration: reference/configuration.md
      - HTTP API: reference/api.md
      - Make targets: reference/make-targets.md
  - Project:
      - Migrating from 2.x: project/migrating-from-2.md
      - Changelog: project/changelog.md
      - Contributing: project/contributing.md
      - License: project/license.md
