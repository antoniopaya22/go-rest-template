name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: go_rest_template_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d go_rest_template_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/go_rest_template_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # latest 1.26 patch release, so the standard library has every security fix
          go-version: '1.26.x'
          check-latest: true

      - name: Sync modules
        run: go mod tidy

      - name: Verify module files are clean
        run: git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test with race detector
        run: go test -race ./...

  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f build/package/Dockerfile -t go-rest-template:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 \
            -e APP_ENV=development -e DATABASE_DRIVER=sqlite -e SQLITE_PATH=/tmp/app.db \
            go-rest-template:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
