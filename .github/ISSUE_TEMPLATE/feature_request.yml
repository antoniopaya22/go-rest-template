name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, and the alternatives you considered.
  - type: dropdown
    id: scope
    attributes:
      label: Where does it belong?
      options:
        - Core (always present)
        - Optional module (selectable at init)
        - Tooling, CI or deployment
        - Documentation
        - Not sure
